server {
    listen 80;
    server_name _;
    # Docker's embedded DNS lets nginx recover when the API container is
    # recreated during a live demo or rebuild.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $control_plane http://control-plane:8000;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + SSE stream to the control plane. Strip the /api prefix.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # SSE: disable buffering so events flush immediately.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
